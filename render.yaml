   services:
     - type: web
       name: kindervale-website
       runtime: node
       plan: free
       buildCommand: npm install && npm run build
       startCommand: node server.js
       envVars:
         - key: NODE_ENV
           value: production
         - key: DATABASE_URL
           sync: false
         - key: JWT_SECRET
           generateValue: true
         - key: ADMIN_EMAIL
           sync: false
         - key: ADMIN_PASSWORD
           sync: false
         - key: PRINCIPAL_EMAIL
           sync: false
         - key: RESEND_API_KEY
           sync: false
         - key: EMAIL_FROM
           sync: false
         - key: CLOUDINARY_URL
           sync: false
